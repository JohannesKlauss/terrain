[project]
name = "openlock-terrain"
version = "0.1.0"
description = "Agent-driven parametric OpenLOCK terrain"
requires-python = ">=3.11"
dependencies = [
  "lxml>=6,<7",
  "networkx>=3.5,<4",
  "pillow>=11,<13",
  "rtree>=1.4,<2",
  "scipy>=1.15,<2",
  "shapely>=2,<3",
  "trimesh>=4.11,<5",
]

[project.scripts]
terrain = "terrain.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terrain = ["templates/*.html", "templates/*.css", "templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
